name: Update proxy list

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: update-proxy-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MAX_CANDIDATES: "1000"
      PROXY_TIMEOUT: "6"
      TEST_URLS: "https://www.gstatic.com/generate_204,https://cp.cloudflare.com/generate_204"
      RECHECK_LIMIT: "500"
      TEST_WORKERS: "20"
      STABILITY_ROUNDS: "3"
      STABILITY_INTERVAL: "10"
      FINAL_LIMIT: "300"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Xray
        shell: bash
        run: |
          set -euo pipefail
          VERSION="26.9.9"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) XRAY_ARCH="64" ;;
            aarch64|arm64) XRAY_ARCH="arm64-v8a" ;;
            *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
          esac
          URL="https://github.com/XTLS/Xray-core/releases/download/v${VERSION}/Xray-linux-${XRAY_ARCH}.zip"
          curl --fail --location --retry 3 "$URL" -o /tmp/xray.zip
          mkdir -p /tmp/xray
          python -c "import zipfile; zipfile.ZipFile('/tmp/xray.zip').extractall('/tmp/xray')"
          install /tmp/xray/xray ./xray
          chmod +x ./xray
          ./xray version

      - name: Collect candidates
        run: python collector.py

      - name: Test candidates
        run: python checker.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Update tested proxy list"
            git push
          fi
