name: Update proxy list

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: update-proxy-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MAX_CANDIDATES: "1000"
      PROXY_TIMEOUT: "6"
      TEST_URLS: "https://www.gstatic.com/generate_204,https://cp.cloudflare.com/generate_204"
      RECHECK_LIMIT: "500"
      TEST_WORKERS: "20"
      STABILITY_ROUNDS: "3"
      STABILITY_INTERVAL: "10"
      FINAL_LIMIT: "300"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Sing-box
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.11.15"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) SB_ARCH="amd64" ;;
            aarch64|arm64) SB_ARCH="arm64" ;;
            *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
          esac
          URL="https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-${SB_ARCH}.tar.gz"
          curl --fail --location --retry 3 "$URL" -o /tmp/sing-box.tar.gz
          mkdir -p /tmp/sing-box
          tar -xzf /tmp/sing-box.tar.gz -C /tmp/sing-box
          SB="$(find /tmp/sing-box -type f -name sing-box | head -n 1)"
          test -n "$SB"
          install "$SB" ./sing-box
          chmod +x ./sing-box
          ./sing-box version

      - name: Collect candidates
        run: python collector.py

      - name: Test candidates
        run: python checker.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Update tested proxy list"
            git push
          fi
